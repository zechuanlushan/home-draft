<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>home-draft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= 侧栏 ================= -->
<aside id="sidebar">
  <div class="sb-head">
    <div class="sb-title"><span class="dot"></span>home-draft</div>
  </div>
  <div class="sb-list" id="conv-list"></div>
  <div class="sb-foot">
    <button class="btn primary" onclick="newConversation()">+ 新对话</button>
    <button class="btn ghost" onclick="openSettings()">⚙ 设置</button>
  </div>
</aside>

<!-- ================= 主区 ================= -->
<main id="main">
  <div id="topbar">
    <button class="icon-btn" onclick="toggleSidebar()" title="侧栏">☰</button>
    <div class="conv-title" id="conv-title">新对话</div>
    <span class="mcp-badge" id="mcp-badge" title="MCP 状态">MCP 未连接</span>
    <button class="icon-btn" onclick="openExport()" title="导出">⤓</button>
  </div>

  <div id="welcome">
    <h1>home-draft</h1>
    <p>一个跑在本地的家。<br>先去设置里填 provider，再跟 miro 说句话。</p>
    <button class="btn" onclick="openSettings()">开始配置</button>
  </div>

  <div id="messages" class="hidden"></div>

  <div id="composer" class="hidden">
    <div id="input-box">
      <div id="attachments"></div>
      <div id="input-row">
        <textarea id="input" rows="1" placeholder="说点什么…（Ctrl+V 粘贴图片，@机名 定向呼叫）"></textarea>
        <button id="send-btn" onclick="onSendClick()" title="发送 / 停止">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="hint"><span>Enter 发送 · Shift+Enter 换行</span><span id="mode-hint"></span></div>
  </div>
</main>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<!-- 按依赖顺序加载：core → chat → ui -->
<script src="js/core.js"></script>
<script src="js/chat.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
